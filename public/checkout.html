<body class="l-root commerce-page">
  <header data-slot="header"></header>

  <!-- Bag.dc.html step=checkout as a page, on the fan's Ztor cart. checkout.js owns everything inside [data-checkout]:
       pickup contact + payment method + the shop's quote, then the payment page; /checkout/done shows the result. -->
  <main class="l-page container checkout-page" data-checkout>
    <header class="checkout-page__head l-reveal" style="--i:0" data-co-head>
      <button class="checkout-page__back" type="button" data-co-back>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"></path></svg>
        <span data-co-back-label data-i18n>Back to bag</span>
      </button>
      <h1 class="checkout-page__title" data-co-title tabindex="-1" data-i18n>Checkout</h1>
    </header>

    <div class="checkout-page__grid" data-co-grid>
      <section class="checkout-page__main l-reveal" style="--i:1" data-co-main aria-label="Checkout details" data-i18n-aria-label></section>
      <aside class="checkout-page__aside l-reveal" style="--i:2" data-co-aside aria-label="Order summary" data-i18n-aria-label></aside>
    </div>

    <section class="checkout-page__state checkout-page__confirm" data-co-confirm hidden></section>
    <section class="checkout-page__state checkout-page__empty" data-co-empty hidden></section>
  </main>

  <div class="safari-toolbar-sampling-shim" aria-hidden="true"></div>
  <script type="module">
    import * as state from './js/ztor/state.js';
    import { mountSite } from './js/site.js';
    // the fan and their bag first: checkout, the header's bag count and the drawer render from them
    await state.hydrate(['member', 'cart']).catch(() => {});
    mountSite();
    import('./js/checkout.js');
  </script>
</body>
